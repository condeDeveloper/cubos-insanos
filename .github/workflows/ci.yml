name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  testes:
    name: testes (${{ matrix.so }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.so }}
    strategy:
      fail-fast: false
      matrix:
        so: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # O `shell: bash` nao e enfeite: no PowerShell do runner o glob chega ao
      # node como texto literal.
      - name: "as regras e os numeros do README"
        shell: bash
        run: node --test testes/nucleo.test.js testes/medidas.test.js
      - name: "os dois dominios de centenas de milhares de conjuntos"
        shell: bash
        run: node --test testes/pesados.test.js

  medidas:
    name: tabelas do README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: "3 cubos e 3 cores, todos os conjuntos"
        run: node ferramentas/medidor.js tres
      - name: "o quebra-cabeca de 4 cubos"
        run: node ferramentas/medidor.js quebra
      - name: "6 faces de cada cor"
        run: node ferramentas/medidor.js seis
      - name: "cada cubo com as 4 cores"
        run: node ferramentas/medidor.js cores
      - name: "a geometria contra o grafo e o controle negativo"
        run: node ferramentas/medidor.js juiz
      - name: "a geometria nos dominios grandes, uma vez so"
        run: node --test testes/juiz.test.js
